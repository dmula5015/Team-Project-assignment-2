<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="College Student Planner helps students manage classes and assignments."><title>Assignments | Student Planner</title><link rel="stylesheet" href="css/style.css" defer></head><body><header><nav><div class="brand">STUDENT PLANNER</div><div class="links"><a href="index.html" class="">Dashboard</a><a href="classes.html" class="">My Classes</a><a href="assignments.html" class="active">Assignments</a><a href="upcoming.html" class="">Upcoming Due</a><a href="about.html" class="">About</a></div></nav></header><main><div class="hero"><h1>Assignments</h1><p class="muted">Add, complete, and remove tasks as you finish them.</p></div><div class="panel" id="new"><h2>Add Assignment</h2><form id="assignmentForm"><div class="form-grid"><label>Assignment name<input id="taskName" required maxlength="120" placeholder="Example: Chapter Review"></label><label>Class<select id="taskClass" required></select></label><label>Due date<input id="taskDate" type="date" required></label><label>Type<select id="taskType"><option>Homework</option><option>Quiz</option><option>Test</option><option>Project</option><option>Other</option></select></label></div><p><button class="btn" type="submit">Save Assignment</button></p></form></div><section class="section"><div class="row"><h2>All Assignments</h2><label>Show<select id="taskFilter"><option value="all">All</option><option value="open">Not completed</option><option value="done">Completed</option></select></label></div><div class="panel" id="allTasks"></div></section></main><footer>College Student Planner • CIS 332 Web Programming</footer><script src="js/app.js" defer></script></body></html>
